[workspace]
resolver = "3"
members = [
  "crates/kybern-protocol",
  "crates/kybern-store",
  "crates/kybern-drivers",
  "crates/kybern-git",
  "crates/kybern-daemon",
  "crates/kybern-client",
  "crates/kybern-cli",
  "crates/kybern",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/Tresnanda/kybern"
rust-version = "1.88"

[workspace.dependencies]
kybern-protocol = { path = "crates/kybern-protocol" }
kybern-store = { path = "crates/kybern-store" }
kybern-drivers = { path = "crates/kybern-drivers" }
kybern-git = { path = "crates/kybern-git" }
kybern-client = { path = "crates/kybern-client" }
kybern-daemon = { path = "crates/kybern-daemon" }
kybern-cli = { path = "crates/kybern-cli" }

agent-client-protocol = "=2.0.0"
anyhow = "1.0.104"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0.0"
futures = "0.3.34"
portable-pty = "0.9.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "=2.5.8"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
tokio-util = { version = "0.7.19", features = ["codec", "compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }
which = "8"
insta = { version = "1", features = ["json", "yaml"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# dist (cargo-dist) builds release artifacts with this profile.
[profile.dist]
inherits = "release"

# Proc-macro dylibs are loaded by later Cargo invocations in the desktop
# sidecar build. Stripping them on macOS makes those cached dylibs unloadable;
# shipped binaries still use the release profile's strip setting above.
[profile.release.build-override]
strip = false
