[workspace]
resolver = "3"
members = [
  "crates/kybern-protocol",
  "crates/kybern-store",
  "crates/kybern-drivers",
  "crates/kybern-git",
  "crates/kybern-daemon",
  "crates/kybern-client",
  "crates/kybern-cli",
  "crates/kybern-app",
  "crates/kybern-term",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Tresnanda/kybern"
rust-version = "1.88"

[workspace.dependencies]
kybern-protocol = { path = "crates/kybern-protocol" }
kybern-store = { path = "crates/kybern-store" }
kybern-drivers = { path = "crates/kybern-drivers" }
kybern-git = { path = "crates/kybern-git" }
kybern-client = { path = "crates/kybern-client" }
kybern-term = { path = "crates/kybern-term" }

agent-client-protocol = "=2.0.0"
alacritty_terminal = "0.26"
# gpui must resolve to the same Zed checkout gpui-component uses (it depends on the
# unpinned git source), so these stay unpinned too and Cargo.lock pins the rev.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "d6c10c21a58617b29494f8efeba4895ca384e465", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-go", "tree-sitter-bash", "tree-sitter-markdown", "tree-sitter-diff", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-css", "tree-sitter-html", "tree-sitter-swift", "tree-sitter-kotlin", "tree-sitter-java", "tree-sitter-c", "tree-sitter-cpp"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "d6c10c21a58617b29494f8efeba4895ca384e465" }
anyhow = "1.0.104"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0.0"
futures = "0.3.34"
portable-pty = "0.9.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["codec", "compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }
which = "8"
insta = { version = "1", features = ["json"] }

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
markdown = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
