[package]
name = "kybern"
description = "kybern: the kybernd daemon and the kybern command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The one package dist ships: one archive per target holding both binaries.
[[bin]]
name = "kybernd"
path = "src/bin/kybernd.rs"

[[bin]]
name = "kybern"
path = "src/bin/kybern.rs"

[dependencies]
kybern-daemon.workspace = true
kybern-cli.workspace = true
anyhow.workspace = true
# kybernd folds whole-thread transcripts per request; the system allocator on
# macOS retains those freed pages as resident ("Malloc Large (empty)"). jemalloc
# with background purge returns decayed pages to the OS under a heavy store.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
kybern-client.workspace = true
kybern-protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
