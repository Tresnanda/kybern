[package]
name = "kybern-daemon"
description = "The kybern daemon: owns agents, threads, terminals and git state; serves clients over WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kybern-protocol.workspace = true
kybern-store.workspace = true
kybern-drivers.workspace = true
kybern-git.workspace = true
kybern-client.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
directories.workspace = true
ed25519-dalek = "=3.0.0"
futures.workspace = true
libc.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
portable-pty.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
zeroize = "=1.9.0"
semver = "=1.0.28"
# Verifies the desktop app's signed updates with the key its own updater uses (ADE-125). Zero dependencies.
minisign-verify = "=0.3.0"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse", "display"] }
# The Fast (HTTP/2) mode of a forwarded preview (ADE-116): TLS to Kybern's web views with a per-install
# certificate, HTTP/2 between the machines, pooled HTTP/1.1 to the dev server.
hyper = { version = "=1.11.1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1", "http2"] }
http-body-util = "=0.1.5"
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
time = { version = "=0.3.55", default-features = false, features = ["std"] }
flate2 = "=1.1.10"

[target.'cfg(windows)'.dependencies]
# Shares account skill/plugin folders without the symlink privilege stock Windows users lack.
junction = { version = "=2.1.0", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry"] }

[dev-dependencies]
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
