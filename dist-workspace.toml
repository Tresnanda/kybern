# Config for `dist` (cargo-dist): https://axodotdev.github.io/cargo-dist/
#
# Builds and publishes the `kybern` package: one archive per target that holds
# both the daemon (`kybernd`) and the CLI (`kybern`), plus one installer.
# The desktop apps (Tauri and Kybern GPUIX) are built by
# .github/workflows/desktop.yml, which dist runs as a global-artifacts job: it
# bundles the daemon and CLI that build-local-artifacts just built, and host
# publishes its assets, latest.json for the desktop updater and the
# kybern-remote-install.sh helper for daemon-only machines in the same release.

[workspace]
members = ["cargo:."]

[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# A tag can race main CI; require that exact commit before publishing.
# The local-artifacts phase makes host depend directly on the gate: plan-only
# gates leave skipped builds, which dist permits the host job to bypass.
local-artifacts-jobs = ["./release-ci"]
# dist also makes the desktop bundles wait for the gate, although only the
# publishing `host` job must. release.yml is hand-edited to drop
# `custom-release-ci` from `custom-desktop`'s needs, so the bundles (the longest
# phase) run while CI finishes. After `dist generate` (remove allow-dirty for
# it), reapply that edit; the release gate test fails if it is missing or if
# `host` stops waiting for the gate, and scripts/check-release-workflow.mjs (CI)
# fails when release.yml differs from `dist generate` anywhere else.
allow-dirty = ["ci"]
# The desktop bundles need every target's archive, and host waits for them.
global-artifacts-jobs = ["./desktop"]
github-custom-job-permissions = { "release-ci" = { actions = "read", contents = "read" }, "desktop" = { contents = "read" } }
# Default every package to "do not distribute"; crates/kybern opts back in with
# `dist = true` in its own dist.toml.
# (The `packages = [...]` allow-list is not honoured by dist 0.32 for Cargo workspaces.)
dist = false
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Host release artifacts on GitHub Releases
hosting = ["github"]
# Build only the shipped packages (`--package`), not the whole workspace: the
# Tauri desktop crate cannot build for headless musl targets and is not needed.
precise-builds = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# No separate self-update binaries: rerunning the installer upgrades in place.
install-updater = false
# GitHub already offers the source for every tag.
source-tarball = false
# Cache cargo builds between releases in dist's build jobs (steps injected
# into build-local-artifacts).
github-build-setup = "../dist-build-setup.yml"

# Pin the actions dist uses to commits rather than floating tags.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"          # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"   # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1

# Cross-compile the Intel Mac build on Apple Silicon, like the desktop app has
# always done: the Intel runner took about 29 minutes and set the release's pace.
[dist.github-custom-runners]
x86_64-apple-darwin = { runner = "macos-15", host = "aarch64-apple-darwin" }
