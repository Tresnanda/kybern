name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request supersedes its running checks. Pushes to main
# never cancel anything: each commit has its own group, because a release
# waits for the exact commit's main run (scripts/check-release-ci.mjs) and a
# shared group would drop the pending run of an intermediate commit.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  changes:
    # Pull requests run only the jobs their files can affect. main runs every
    # job on every push (releases require all of them), so there every output
    # is true. The paths are the inputs of each job, not of the product:
    #   rust     the Cargo workspace and the transcript fixtures its tests embed
    #   release  the scripts, workflows, dist config and Cursor SDK host the
    #            release and tooling regression tests read
    #   gpuix    the GPUIX app, the shared TypeScript client (its tests run
    #            here), the branded background GPUIX bundles, and the fixtures
    #            and daemon visuals script the client tests load
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The pull request's file list.
      pull-requests: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      release: ${{ steps.paths.outputs.release }}
      gpuix: ${{ steps.paths.outputs.gpuix }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            files=ALL
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --jq '.[] | .filename, (.previous_filename // empty)')
          fi
          echo "changed files:"; echo "${files:-<none>}" | sed 's/^/  /'
          matches() { [ "$files" = ALL ] || echo "$files" | grep -Eq "$1"; }
          output() { if matches "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          # Editing this workflow or its setup action runs everything.
          self='^\.github/(workflows/ci\.yml|actions/setup-pnpm-apps/)'
          output rust "$self|^(crates/|fixtures/|Cargo\.(toml|lock)$|rust(-toolchain|fmt)\.toml$|\.cargo/)"
          output release "$self|^(scripts/|\.github/|dist-workspace\.toml$|Cargo\.toml$|crates/kybern/dist\.toml$|crates/kybern-drivers/src/cursor/sdk/)"
          output gpuix "$self|^(apps/gpuix/|packages/|assets/release-background\.png$|fixtures/|crates/kybern-daemon/src/visuals/)"

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's cache; only main writes it, which
          # keeps the repository's cache storage under its limit.
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux credential-store dependencies
        if: runner.os == 'Linux'
        # Usually under a minute; a stalled mirror once held this step for 18 minutes.
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libdbus-1-dev
      - name: clippy
        run: >
          cargo clippy --workspace --all-targets
          -- -D warnings
      - name: test
        run: cargo test --workspace

  windows-check:
    name: cargo check (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # As above, pull requests restore main's cache; only main writes it.
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Check test code too, without running Windows tests.
      - name: check
        run: cargo check --workspace --all-targets

  release:
    name: release checks
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release gate and updater manifest regression tests
        run: node --test scripts/check-release-ci.test.mjs scripts/updater-manifest.test.mjs
      - name: release.yml matches dist's output
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
          node scripts/check-release-workflow.mjs
      - name: Cursor SDK host lifecycle
        run: node --test crates/kybern-drivers/src/cursor/sdk/host.test.mjs

  gpuix:
    # GPUIX has no native runner here (its window checks need a display), but
    # its types and unit tests do not. The shared TypeScript client's tests run
    # here too.
    name: gpuix (typecheck + test)
    needs: changes
    if: needs.changes.outputs.gpuix == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm-apps
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
          # The Bun binary downloads in seconds; a cache entry per ref is not worth the storage.
          no-cache: true
      - name: typecheck
        working-directory: apps/gpuix
        run: pnpm typecheck
      # Since 0.11 the stock Linux binding links xkbcommon-x11; some unit tests load it.
      - name: native binding libraries
        run: sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0
      - name: test
        working-directory: apps/gpuix
        run: bun test
      - name: shared client tests
        run: node --experimental-strip-types --test packages/kybern-client/tests/*.test.mjs

  ci:
    # One check that is red when any job failed or was cancelled, and green when
    # the jobs a pull request does not need were skipped. A branch protection
    # rule needs only this name.
    name: CI
    if: always()
    needs: [changes, fmt, check, windows-check, release, gpuix]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
