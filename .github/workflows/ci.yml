name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Full checks for a release candidate that did not itself bump the version.
  workflow_dispatch:

# A new push to a pull request supersedes its running checks. Pushes to main
# never cancel anything: each commit has its own group, because a release
# waits for the exact commit's main run (scripts/check-release-ci.mjs) and a
# shared group would drop the pending run of an intermediate commit.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  changes:
    # PRs and ordinary main pushes run only affected jobs. Version bumps on
    # main and manual runs check everything for the exact-commit release gate.
    # scripts/ci-paths.mjs owns the paths, which are inputs of each job:
    #   rust     the Cargo workspace and the transcript fixtures its tests embed
    #   release  the scripts, workflows, dist config and Cursor SDK host the
    #            release and tooling regression tests read
    #   gpuix    the GPUIX app, the shared TypeScript client (its tests run
    #            here), the branded background GPUIX bundles, and the fixtures
    #            and daemon visuals script the client tests load
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The pull request's file list.
      pull-requests: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      release: ${{ steps.paths.outputs.release }}
      gpuix: ${{ steps.paths.outputs.gpuix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-paths.mjs

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Clippy only type-checks, so its cache is separate from the test
          # builds'. As below, pull requests restore main's cache; only main writes it.
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux credential-store dependencies
        if: runner.os == 'Linux'
        # Usually under a minute; a stalled mirror once held this step for 18 minutes.
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libdbus-1-dev
      - name: clippy
        run: >
          cargo clippy --workspace --all-targets
          -- -D warnings

  test:
    # cargo-nextest runs every test in its own process, so one test's forked
    # child can never hold another test's freshly written fixture open (Linux
    # ETXTBSY), and the test binaries run in parallel. The `ci` profile in
    # .config/nextest.toml retries a failed test once: a test that then passes
    # is quarantined, not blocking: scripts/report-flaky-tests.mjs lists it in
    # the job summary and, on pushes to main only, files or updates its `flaky`
    # issue. A test that fails both attempts fails the job. The workspace has no doctests, which
    # nextest does not run; add `cargo test --workspace --doc` here with the first.
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Filing and updating flaky-test issues (pushes to main only).
      issues: write
    env:
      # Panics keep file and line numbers; full debug info only slows compiling and linking.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          # A prebuilt binary, checked against the action's pinned checksum.
          tool: cargo-nextest@0.9.150
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's cache; only main writes it, which
          # keeps the repository's cache storage under its limit.
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux credential-store dependencies
        if: runner.os == 'Linux'
        # Usually under a minute; a stalled mirror once held this step for 18 minutes.
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libdbus-1-dev
      - name: build tests
        run: cargo nextest run --workspace --profile ci --no-run
      - name: test
        run: cargo nextest run --workspace --profile ci
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FLAKY_RUNNER: ${{ matrix.os }}
        run: node scripts/report-flaky-tests.mjs target/nextest/ci/junit.xml

  windows-check:
    name: cargo check (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # As above, pull requests restore main's cache; only main writes it.
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Check test code too, without running Windows tests.
      - name: check
        run: cargo check --workspace --all-targets

  release:
    name: release checks
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release gate and updater manifest regression tests
        run: node --test scripts/ci-paths.test.mjs scripts/check-release-ci.test.mjs scripts/report-flaky-tests.test.mjs scripts/updater-manifest.test.mjs scripts/release.test.mjs
      - name: release.yml matches dist's output
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
          node scripts/check-release-workflow.mjs
      - name: Cursor SDK host lifecycle
        run: node --test crates/kybern-drivers/src/cursor/sdk/host.test.mjs

  gpuix:
    # GPUIX has no native runner here (its window checks need a display), but
    # its types and unit tests do not. The shared TypeScript client's tests run
    # here too.
    name: gpuix (typecheck + test)
    needs: changes
    if: needs.changes.outputs.gpuix == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm-apps
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
          # The Bun binary downloads in seconds; a cache entry per ref is not worth the storage.
          no-cache: true
      - name: typecheck
        working-directory: apps/gpuix
        run: pnpm typecheck
      # Since 0.11 the stock Linux binding links xkbcommon-x11; some unit tests load it.
      - name: native binding libraries
        run: sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0
      - name: test
        working-directory: apps/gpuix
        run: bun test
      - name: shared client tests
        run: node --experimental-strip-types --test packages/kybern-client/tests/*.test.mjs

  ci:
    # One check that is red when any job failed or was cancelled, and green when
    # the jobs a change does not need were skipped. A branch protection
    # rule needs only this name.
    name: CI
    if: always()
    needs: [changes, fmt, clippy, test, windows-check, release, gpuix]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
