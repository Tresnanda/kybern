# Keeps the cache of the patched GPUIX native addon (the cargo build inside
# apps/gpuix/native/update.sh) warm for releases. A tag can restore caches
# saved by main but never another tag's, and GitHub deletes a cache nobody has
# restored for seven days, hence the weekly run.
#
# The cache lives in .github/actions/gpuix-addon; desktop.yml's gpuix,
# gpuix-linux and gpuix-windows jobs use the same action to restore it.
name: GPUIX addon cache

on:
  push:
    branches: [main]
    paths:
      - 'apps/gpuix/native/VERSION'
      - 'apps/gpuix/native/update.sh'
      - 'apps/gpuix/native/FORK'
      - 'apps/gpuix/native/markdown-document-test.py'
      - '.github/actions/gpuix-addon/**'
      - '.github/workflows/gpuix-addon.yml'
  # A pull request that edits the action or this workflow runs it to check it;
  # it saves nothing a tag could restore.
  pull_request:
    paths:
      - '.github/actions/gpuix-addon/**'
      - '.github/workflows/gpuix-addon.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: gpuix-addon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  addon:
    name: addon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          # The runner desktop.yml's Linux GPUIX lane packages on (its glibc is the floor).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # update.sh runs in Git Bash on Windows: `python`, and UTF-8 for the patch drivers.
      PYTHON: ${{ startsWith(matrix.os, 'windows') && 'python' || 'python3' }}
      PYTHONUTF8: "1"
    steps:
      - name: Allow long paths (zed's tree) and keep LF line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      - name: Install the GPUIX Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --target "${{ matrix.target }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
          no-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - uses: ./.github/actions/gpuix-addon
        with:
          target: ${{ matrix.target }}
          save: ${{ github.event_name != 'pull_request' }}
