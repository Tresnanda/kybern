# The Windows embedded web view (WP10): `kybern-webview.dll`, the counterpart of `native/webview.m` behind the same three
# C exports that `src/native/webview.ts` loads with `bun:ffi`. WebView2 composition hosting under a Windows.UI.Composition
# target on GPUI's window (apps/gpuix/WEBVIEW-PLATFORMS.md). Built by `native/build-webview.ts` on Windows; on other
# hosts only the platform-independent modules compile, so `cargo test` runs anywhere.
[package]
name = "kybern-webview"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "kybern_webview"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde_json = "=1.0.151"

# Exact pins. `windows` 0.61 is the zed fork's version; webview2-com 0.38.2 (WebView2 SDK 1.0.3650.58) is the last line
# on it. `webview2-com-sys` links WebView2LoaderStatic.lib, so no loader DLL ships.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
windows-numerics = "=0.2.0"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.61.3"
features = [
    "Foundation",
    "Foundation_Numerics",
    "Graphics",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
