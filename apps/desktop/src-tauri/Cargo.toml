[package]
name = "kybern-desktop"
description = "kybern desktop client (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"

[lib]
name = "kybern_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
kybern-client.workspace = true
kybern-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log = "0.4"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2.7.3"
