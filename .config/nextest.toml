# cargo-nextest settings. CI runs `cargo nextest run --workspace --profile ci`
# (.github/workflows/ci.yml). Locally, `cargo test --workspace` works as before,
# and `cargo nextest run --workspace` uses the default profile: no retries.

[profile.default]
retries = 0

[profile.ci]
# Quarantine instead of block: a test that fails and then passes on its retry
# does not fail the job. scripts/report-flaky-tests.mjs lists it in the job
# summary and files or updates its `flaky` issue, which still has to be fixed.
# A test that fails both attempts fails CI.
retries = 1
# Report every failure in one run.
fail-fast = false
failure-output = "immediate-final"
# A test that hangs is stopped after five minutes instead of holding the job.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
# target/nextest/ci/junit.xml: flaky tests appear as passing test cases with
# <flakyFailure> attempts.
path = "junit.xml"
